name: Bronze Data Release Pipeline

on:
  push:
    branches: [data/bronze]
    paths: [.github/workflows/publish-bronze.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bronze
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and Publish Bronze Dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view bronze > /dev/null 2>&1; then
            echo 'The bronze release already exists; refusing to overwrite it.'
            exit 1
          fi
      - name: Download and validate Bronze dataset
        env:
          BRONZE_SOURCE: ${{ secrets.BRONZE_IMPORT_URL }}
        run: python3 scripts/build_bronze.py
      - name: Publish Bronze release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create bronze data/bronze/ufo.db \
            --target "$GITHUB_SHA" \
            --title Bronze \
            --notes-file data/bronze/README.md
