<!doctype html><html lang="es"><meta charset="utf-8"><title>Río de formas</title><link rel="stylesheet" href="estilo.css">
<style>svg{position:absolute;left:4vw;top:16vh;width:92vw;height:76vh} text{font-size:13px;fill:#0b1016;font-weight:600} .eje{fill:#b6c2cf;font-weight:400}</style>
<header><h1>El río de las formas, 1940–2020</h1><p>Proporción de cada forma entre los informes clasificados de cada década. Los discos de los años 50 ceden paso a luces y triángulos.</p></header>
<button data-play>Pausa</button>
<p class="nota">Porcentaje sobre los informes con forma estandarizada y año fiable de cada década; se muestran las 9 formas más frecuentes.</p>
<svg viewBox="0 0 1200 560" id="s"><defs><clipPath id="clip"><rect id="cr" x="0" y="0" width="0" height="560"/></clipPath></defs><g id="g" clip-path="url(#clip)"></g><g id="ejes"></g></svg>
<script src="comun.js"></script><script>
const COL = ["#7fb3ff","#ffd166","#ff7b7b","#5ad1c4","#c9b6ff","#ff9f5a","#9be37a","#f28bd4","#8fa3b8"], NS = "http://www.w3.org/2000/svg";
(async () => {
  const { labels, rows } = await datos("formas_decada.json");
  const decadas = [...new Set(rows.map((r) => r[0]))].sort((a, b) => a - b);
  const tot = {}; rows.forEach(([d, s, n]) => tot[s] = (tot[s] ?? 0) + n);
  const top = Object.keys(tot).filter((k) => labels[k] && k !== "Other").sort((a, b) => tot[b] - tot[a]).slice(0, 9);
  const share = decadas.map((d) => { const r = rows.filter((x) => x[0] === d && top.includes(x[1])), s = r.reduce((a, x) => a + x[2], 0);
    return Object.fromEntries(top.map((k) => [k, (r.find((x) => x[1] === k)?.[2] ?? 0) / s])); });
  const x = (i) => 40 + (i / (decadas.length - 1)) * 1120, H = 520, g = document.getElementById("g");
  let base = decadas.map(() => 0);
  top.forEach((k, j) => {
    const y0 = base.slice(), y1 = base.map((b, i) => b + share[i][k]); base = y1;
    const curva = (ys, rev) => { const p = ys.map((v, i) => [x(i), 20 + v * H]); if (rev) p.reverse();
      return p.map((q, i) => (i ? `C${(p[i - 1][0] + q[0]) / 2},${p[i - 1][1]} ${(p[i - 1][0] + q[0]) / 2},${q[1]} ${q[0]},${q[1]}` : `${q[0]},${q[1]}`)).join(""); };
    const path = document.createElementNS(NS, "path"); path.setAttribute("d", `M${curva(y0)}L${curva(y1, true)}Z`); path.setAttribute("fill", COL[j]); g.appendChild(path);
    const i = share.reduce((b, s, ii) => s[k] > share[b][k] ? ii : b, 0), t = document.createElementNS(NS, "text");
    t.setAttribute("x", Math.min(1100, Math.max(50, x(i) - 30))); t.setAttribute("y", 20 + (y0[i] + y1[i]) / 2 * H + 4); t.textContent = labels[k]; if (share[i][k] > 0.05) g.appendChild(t);
  });
  decadas.forEach((d, i) => { const t = document.createElementNS(NS, "text"); t.setAttribute("x", x(i)); t.setAttribute("y", 556); t.setAttribute("class", "eje"); t.setAttribute("text-anchor", "middle"); t.textContent = `${d}s`; document.getElementById("ejes").appendChild(t); });
  reproducir((t) => document.getElementById("cr").setAttribute("width", Math.min(1, t * 1.25) * 1200), 14000);
})();
</script></html>
