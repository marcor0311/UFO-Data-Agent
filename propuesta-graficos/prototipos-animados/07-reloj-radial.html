<!doctype html><html lang="es"><meta charset="utf-8"><title>Reloj de informes</title><link rel="stylesheet" href="estilo.css">
<style>svg{position:absolute;inset:0;margin:auto;width:min(92vh,92vw);height:min(92vh,92vw)} text{fill:#b6c2cf;font-size:11px}</style>
<header><h1>Reloj de los informes</h1><p>24 horas alrededor del círculo, de enero (centro) a diciembre (borde). La aguja barre el día y enciende cada celda.</p></header>
<div class="contador"><strong id="hora">00:00</strong><span id="cuenta"></span></div><button data-play>Pausa</button>
<p class="nota">Hora local declarada y mes fiables. La intensidad es el número de informes de cada hora y mes.</p>
<svg viewBox="-330 -330 660 660" id="s"></svg>
<script src="comun.js"></script><script>
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"], NS = "http://www.w3.org/2000/svg";
const el = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
(async () => {
  const filas = await datos("reloj.json"), s = document.getElementById("s"), m = new Map(filas.map(([mes, h, n]) => [`${mes}-${h}`, n]));
  const max = Math.max(...filas.map((r) => r[2])), r0 = 70, dr = 20, celdas = [];
  const arco = (a0, a1, ri, ro) => { const p = (a, r) => `${r * Math.sin(a)},${-r * Math.cos(a)}`;
    return `M${p(a0, ro)}A${ro},${ro} 0 0 1 ${p(a1, ro)}L${p(a1, ri)}A${ri},${ri} 0 0 0 ${p(a0, ri)}Z`; };
  for (let mes = 1; mes <= 12; mes++) for (let h = 0; h < 24; h++) {
    const n = m.get(`${mes}-${h}`) ?? 0, a0 = (h / 24) * 2 * Math.PI, a1 = ((h + 1) / 24) * 2 * Math.PI;
    const e = el("path", { d: arco(a0 + 0.01, a1 - 0.01, r0 + (mes - 1) * dr + 1, r0 + mes * dr - 1), fill: `hsl(${30 - 30 * n / max} 100% ${12 + 58 * Math.sqrt(n / max)}%)`, opacity: 0.08 });
    s.appendChild(e); celdas.push([h, e]);
  }
  for (let h = 0; h < 24; h += 3) { const a = (h / 24) * 2 * Math.PI, t = el("text", { x: 318 * Math.sin(a), y: -318 * Math.cos(a) + 4, "text-anchor": "middle" }); t.textContent = `${h}h`; s.appendChild(t); }
  [1, 6, 12].forEach((mes) => { const t = el("text", { x: 4, y: -(r0 + (mes - 0.5) * dr) + 4 }); t.textContent = MESES[mes - 1]; s.appendChild(t); });
  const aguja = el("line", { x1: 0, y1: 0, x2: 0, y2: -312, stroke: "#c6d9e9", "stroke-width": 2 }); s.appendChild(aguja);
  const tot = Array.from({ length: 24 }, (_, h) => filas.filter((r) => r[1] === h).reduce((a, r) => a + r[2], 0));
  reproducir((t) => {
    const hf = t * 24, h = Math.floor(hf); aguja.setAttribute("transform", `rotate(${t * 360})`);
    for (const [hh, e] of celdas) e.setAttribute("opacity", hh <= h ? 1 : 0.08);
    document.getElementById("hora").textContent = `${String(h).padStart(2, "0")}:${String(Math.floor((hf % 1) * 60)).padStart(2, "0")}`;
    document.getElementById("cuenta").textContent = `${fmt(tot[h])} informes a esta hora`;
  }, 20000);
})();
</script></html>
