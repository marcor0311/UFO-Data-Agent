<!doctype html><html lang="es"><meta charset="utf-8"><title>Colores reportados</title><link rel="stylesheet" href="estilo.css">
<header><h1>¿De qué color lo vieron?</h1><p>Recorre los colores que declaran los testigos y al final los mezcla en un solo mapa.</p></header>
<div class="contador"><strong id="col">Rojos</strong><span id="cuenta"></span></div><button data-play>Pausa</button>
<p class="nota">Color declarado por el testigo y normalizado por familia. Solo informes con coordenadas aptas para mapa.</p>
<canvas id="c"></canvas>
<script src="comun.js"></script><script>
const COLORES = { red: ["Rojos", "#ff4d4d"], orange: ["Naranja", "#ff9a3c"], white: ["Blancos", "#f4f7ff"], blue: ["Azul", "#4d8bff"],
  green: ["Verdes", "#4dff88"], yellow: ["Amarillo", "#ffe14d"], silver: ["Plateados", "#c0c8d6"], amber: ["Ámbar", "#ffbf00"] };
(async () => {
  const [mundo, filas] = await Promise.all([datos("world.geojson"), datos("colores.json")]);
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio, proy = proyeccion(W, H);
  const base = document.createElement("canvas"); base.width = W; base.height = H; dibujarMundo(base.getContext("2d"), mundo, proy);
  const claves = Object.keys(COLORES), pasos = [...claves, "todos"];
  reproducir((t) => {
    const i = Math.min(pasos.length - 1, Math.floor(t * pasos.length)), k = pasos[i], f = (t * pasos.length) % 1;
    ctx.clearRect(0, 0, W, H); ctx.drawImage(base, 0, 0); ctx.globalCompositeOperation = "lighter"; let total = 0;
    for (const [fam, la, ln, n] of filas) {
      if (!COLORES[fam] || (k !== "todos" && fam !== k)) continue; total += n;
      const [x, y] = proy([ln + 0.5, la + 0.5]), r = (1 + Math.sqrt(n) * 0.9) * devicePixelRatio * (0.6 + 0.4 * Math.sin(f * Math.PI));
      ctx.globalAlpha = k === "todos" ? 0.55 : 0.85; ctx.fillStyle = COLORES[fam][1]; ctx.beginPath(); ctx.arc(x, y, r + 0.6, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    document.getElementById("col").textContent = k === "todos" ? "Todos" : COLORES[k][0];
    document.getElementById("col").style.color = k === "todos" ? "#f0f3f6" : COLORES[k][1];
    document.getElementById("cuenta").textContent = `${fmt(total)} informes`;
  }, 27000);
})();
</script></html>
