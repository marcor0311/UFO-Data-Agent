[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ufo-data-agent-api"
version = "0.1.0"
description = "API del data agent propio sobre Gold de UFO-Data-Agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2.0",
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
